# Hardened upstream config for kubernetes-mcp-server (HTTP mode).
# The policy layer is kubernetes-mcp-proxy (rules JSON); this file only:
#  - binds loopback,  - enables the core+config toolsets,
#  - forces list_output = "yaml" (the proxy's response filter parses YAML
#    item blocks; table output is only a fallback for pods_top/nodes_top).
port = "8081"
bind_address = "127.0.0.1"
toolsets = ["core", "config"]
list_output = "yaml"
# kubeconfig defaults to ~/.kube/config. configuration_view stays at its
# upstream default (disabled in HTTP mode); the proxy denies it as well.
# Safe-by-default example: every write is refused at the source, policy
# or not. This also closes the workload ferret chain (ADVERSARIAL-TESTS:
# create echo Pod mounting a Secret + pods_log). Comment out only if the
# client legitimately needs writes, then consider disable_destructive
# (keeps create/update, blocks delete) as the middle setting.
read_only = true
# stateless = false  # keep default: stateful sessions via Mcp-Session-Id

# Upstream backstop: the same secret-holding kinds the proxy denies are
# denied HERE too (GVK-exact), so direct :8081 access or a proxy hole
# still cannot read them. Keep in sync with deny_kinds (AGENTS.md).
# Note: upstream cannot scope namespaces - that ceiling is RBAC on the
# kubeconfig this process uses.

[[denied_resources]]
group = ""
version = "v1"
kind = "Secret"

[[denied_resources]]
group = ""
version = "v1"
kind = "ConfigMap"

[[denied_resources]]
group = "rbac.authorization.k8s.io"
version = "v1"
kind = "Role"

[[denied_resources]]
group = "rbac.authorization.k8s.io"
version = "v1"
kind = "RoleBinding"

[[denied_resources]]
group = "rbac.authorization.k8s.io"
version = "v1"
kind = "ClusterRole"

[[denied_resources]]
group = "rbac.authorization.k8s.io"
version = "v1"
kind = "ClusterRoleBinding"

[[denied_resources]]
group = "bitnami.com"
version = "v1alpha1"
kind = "SealedSecret"

[[denied_resources]]
group = "external-secrets.io"
version = "v1beta1"
kind = "ExternalSecret"

[[denied_resources]]
group = "external-secrets.io"
version = "v1beta1"
kind = "SecretStore"

[[denied_resources]]
group = "external-secrets.io"
version = "v1beta1"
kind = "ClusterSecretStore"

[[denied_resources]]
group = "secrets-store.csi.x-k8s.io"
version = "v1"
kind = "SecretProviderClass"
